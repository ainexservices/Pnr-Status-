<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AINEX SERVICES</title>

  <meta
    name="description"
    content="Check Indian Railway PNR status with AINEX SERVICES."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="page">

  <!-- BRAND -->
  <section class="brand">

    <div class="brand-icon">🚆</div>

    <div>
      <h1>
        AINEX SERVICES </span>
      </h1>

      <p>
        RAILWAY SERVICES • PNR 
      </p>
    </div>

  </section>


  <!-- MAIN PNR AREA -->
  <section class="pnr-section">

    <div class="checker-label">
      
    </div>

    <h2>
      CHECK 
      <span>PNR STATUS
    </h2>



    <!-- CHECKER CARD -->
    <div class="checker-card">

      <div class="card-title">

        <div class="ticket-icon">
          🎫
        </div>

        <div>
          <h3>CHECK PNR STATUS</h3>
        
        </div>

      </div>


      <form id="pnrForm">

        <label for="pnr">
          PNR NUMBER 
        </label>

        <div class="input-box">

          <small>PNR</small>

          <input
            id="pnr"
            name="pnr"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="10"
            autocomplete="off"
            placeholder="Enter PNR"
            required
          >

        </div>


        <button
          id="checkBtn"
          type="submit"
        >
          🔎 CHECK STATUS 
        </button>

      </form>


      <!-- API RESULT WILL APPEAR HERE -->
      <div
        id="result"
        class="result-container"
        aria-live="polite"
      ></div>


      <div class="privacy">
      </div>

    </div>

  </section>


  <!-- FOOTER -->
  <footer>

    <strong>
      🚆 AINEX SERVICES LIVE PNR
    </strong>

    <span>
      Railway PNR & Ticket Information Services
    </span>

    <small>
      © 2026 AINEX SERVICES 
    </small>

  </footer>

</main>


<script src="script.js"></script>

</body>
</html>
